<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #191f28; } a:hover { color: #000000; }
    .sheet { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  </style>
</helmet>
<div class="sheet" style="width: 390px; padding: 20px 20px 28px; background: #ffffff; color: #191f28; box-sizing: border-box;"><div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #191f28;">카드 T③</span>
      <span style="font-size: 13px; font-weight: 600; color: #8b95a1;">1:1 · 이름만</span>
    </div>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #8b95a1;"><b>정사각 사진 + 이름 한 줄</b>. 가장 사진이 크다. 이 비율이면 홈에서 <b>2열 그리드</b>로도 놓을 수 있다 — 오른쪽에 그 모습을 같이 그렸다.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 20px;">
    <div style="background: #ffffff; border: 1px solid #e5e8eb; border-radius: 16px; overflow: hidden;">
    <div style="position: relative; aspect-ratio: 1 / 1; background: linear-gradient(160deg, #e9ecf0 0%, #d6dbe2 55%, #c9cfd8 100%);">
      <div style="position: absolute; left: 12px; top: 12px; display: flex;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.35));"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
    </div>
    
    <div style="padding: 10px 14px 12px;">
      <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em; color: #191f28;">우리 가족 행복방</span>
    </div>
  </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: .04em; color: #8b95a1;">홈에서 2열로 놓으면</span>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
        <div style="background: #ffffff; border: 1px solid #e5e8eb; border-radius: 14px; overflow: hidden;">
          <div style="position: relative; aspect-ratio: 1 / 1; background: linear-gradient(160deg, #e9ecf0 0%, #d6dbe2 55%, #c9cfd8 100%);"><div style="position: absolute; left: 10px; top: 10px; display: flex;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.35));"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></div></div>
          <div style="padding: 8px 10px 10px;"><span style="font-size: 14px; font-weight: 600; color: #191f28;">우리 가족</span></div>
        </div>
        <div style="background: #ffffff; border: 1px solid #e5e8eb; border-radius: 14px; overflow: hidden;">
          <div style="position: relative; aspect-ratio: 1 / 1; background: linear-gradient(160deg, #eef0f3 0%, #dfe3e8 60%, #d3d8df 100%);"><div style="position: absolute; left: 10px; top: 10px; display: flex;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.35));"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></div></div>
          <div style="padding: 8px 10px 10px;"><span style="font-size: 14px; font-weight: 600; color: #191f28;">할머니와</span></div>
        </div>
      </div>
    </div>
  </div></div>
</x-dc>
</body>
</html>
