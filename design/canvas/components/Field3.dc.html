<helmet>

    body { margin: 0; }

<div class="sheet" style="width: 390px; padding: 20px 20px 28px; background: #f7f8fa; color: #222222; box-sizing: border-box;"><div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">

      <span style="font-size: 13px; font-weight: 600; color: #6a6a6a;">토스 big — 값이 주인공</span>
    </div>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #6a6a6a;">라벨이 작게 위에 뜨고 <b>입력값이 크게(24px)</b>. 한 화면에 질문 하나만 물을 때 어울린다 — 이 앱의 가입 흐름이 그렇다.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 8px 0;">
    <span style="font-size: 13px; font-weight: 600; color: #6a6a6a;">어떻게 불러드릴까요?</span>
    <input type="text" value="막내" style="min-height: 44px; padding: 4px 0; border: 0; border-bottom: 1px solid #dce0e5; border-radius: 0; background: transparent; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #222222; box-sizing: border-box; width: 100%;">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;">
      <span style="font-size: 13px; color: #6a6a6a;">가족들이 부르는 이름이면 돼요</span>
      <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: #3a3a3c;"><span style="width: 16px; height: 16px; border-radius: 100px; background: #3a3a3c; display: grid; place-items: center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>2~10자</span>
