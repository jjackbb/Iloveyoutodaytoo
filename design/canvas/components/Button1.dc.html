<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #3a3a3c; } a:hover { color: #2a2a2c; }
    .sheet { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    button, input { font-family: inherit; }
  </style>
</helmet>
<div class="sheet" style="width: 390px; padding: 20px 20px 28px; background: #f7f8fa; color: #222222; box-sizing: border-box;"><div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #222222;">버튼 ①</span>
      <span style="font-size: 13px; font-weight: 600; color: #6a6a6a;">지금 — 그라데이션 + 그림자</span>
    </div>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #6a6a6a;">52px · 반지름 17 · 135° 그라데이션 · 버튼 아래 그림자.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <button style="min-height: 52px; padding: 0 24px; border: 0; border-radius: 17px; font-size: 18px; font-weight: 600; color: #ffffff; background: linear-gradient(135deg, #3a3a3c 0%, #525255 100%); box-shadow: 0 12px 22px -10px rgb(25 31 40 / 0.30); cursor: pointer; width: 100%;">시작하기</button>
    <button style="min-height: 52px; padding: 0 24px; border: 2px solid #3a3a3c; border-radius: 17px; font-size: 18px; font-weight: 600; color: #3a3a3c; background: #ffffff; box-shadow: none; cursor: pointer; width: 100%;">다른 방법으로 시작하기</button>
    <button style="min-height: 44px; padding: 0 24px; border: 0; border-radius: 17px; font-size: 16px; font-weight: 600; color: #3a3a3c; background: transparent; box-shadow: none; cursor: pointer; width: 100%;">나중에</button>
  </div></div>
</x-dc>
</body>
</html>
