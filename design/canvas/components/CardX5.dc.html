    <div style="display: flex; align-items: baseline; gap: 8px;"><span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #191f28;">⑤ 당근마켓식</span><span style="font-size: 13px; font-weight: 600; color: #8b95a1;">숫자 원형 뱃지 · 이름표 모서리에 걸침</span></div>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #8b95a1;">당근·카톡류 앱은 <b>숫자가 든 작은 원</b>을 아이콘·이름표 모서리에 <b>실제로 걸쳐서</b> 얹는다(iOS 알림 뱃지 문법) — 흰 테두리로 사진과 분리한다.</p><p style="margin: 8px 0 0; font-size: 12px; line-height: 1.6; color: #a15200; background: #fff4e8; border: 1px solid #ffe3c2; border-radius: 8px; padding: 8px 10px;">⚠️ 이 안은 검증되지 않았다. 당근마켓 공식 디자인 문서나 실제 화면을 이 세션에서 확인하지 못했다. 색(#ff8a3d)은 당근 특유의 오렌지 계열이라고 널리 알려진 톤이지 공식 hex가 아니고, 뱃지 크기·위치도 일반적인 '숫자 원형 뱃지' 관례를 재현한 것이지 당근마켓 화면을 실측한 게 아니다.</p></div><div style="display: flex; flex-direction: column; gap: 16px;"><div style="background: #ffffff; border: 1px solid #e5e8eb; border-radius: 16px; overflow: hidden;">
    <div style="position: relative; aspect-ratio: 4 / 3; background: radial-gradient(ellipse 60% 45% at 18% 78%, #fdfdfb 0%, rgb(253 253 251 / 0) 60%),radial-gradient(ellipse 40% 50% at 70% 30%, #2b2f36 0%, rgb(43 47 54 / 0) 55%),radial-gradient(ellipse 55% 35% at 85% 85%, #f2e9d8 0%, rgb(242 233 216 / 0) 60%),linear-gradient(160deg, #8a949e 0%, #5d6670 50%, #c9cfd8 100%);">
      <div style="position: absolute; right: 12px; top: 12px; display: flex;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(0 1px 2px rgb(0 0 0 / 0.35));"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg></div>
      <span style="position: absolute; left: 0; bottom: 0; display: inline-block;">

        </span>
