<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #3a3a3c; } a:hover { color: #2a2a2c; }
    .sheet { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
    .tag { font-size: 11px; font-weight: 600; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
    button, input { font-family: inherit; }
  </style>
</helmet>
<div class="sheet" style="width: 390px; padding: 20px 20px 28px; background: #ffffff; color: #191f28; box-sizing: border-box;"><div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #191f28;">칩 ②</span>
      <span style="font-size: 13px; font-weight: 600; color: #8b95a1;">세그먼트 — 한 트랙 안에서</span>
    </div>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #8b95a1;">연한 트랙(14px) 안에서 <b>고른 칸이 흰 알약으로 떠오른다</b>. 지금 토큰의 inner-sm(11px)이 정확히 이 자리를 위한 것이었다. 뱃지는 토스 weak.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 14px; background: #f2f4f6;">
      <span style="padding: 9px 0; text-align: center; border-radius: 11px; background: #ffffff; box-shadow: 0 3px 8px -3px rgb(25 31 40 / 0.18); color: #191f28; font-size: 14px; font-weight: 600;">전체</span>
      <span style="padding: 9px 0; text-align: center; border-radius: 11px; color: #8b95a1; font-size: 14px; font-weight: 600;">좋아요</span>
      <span style="padding: 9px 0; text-align: center; border-radius: 11px; color: #8b95a1; font-size: 14px; font-weight: 600;">1:1</span>
      <span style="padding: 9px 0; text-align: center; border-radius: 11px; color: #8b95a1; font-size: 14px; font-weight: 600;">랜덤</span>
    </div>
    <div style="display: flex; gap: 6px;">
      <span style="padding: 4px 8px; border-radius: 6px; background: #f2f4f6; color: #4e5968; font-size: 12px; font-weight: 600;">3초 이상</span>
      <span style="padding: 4px 8px; border-radius: 6px; background: #f2f4f6; color: #8b95a1; font-size: 12px; font-weight: 600;">선택</span>
    </div>
  </div></div>
</x-dc>
</body>
</html>
