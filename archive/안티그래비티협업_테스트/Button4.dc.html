<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .sheet { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  </style>
</helmet>
<div class="sheet" style="width: 390px; padding: 20px 20px 28px; background: #ffffff; color: #191f28; box-sizing: border-box;">
  <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 24px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #191f28;">버튼 ④</span>
      <span style="font-size: 13px; font-weight: 600; color: #bf3f0d;">찐 토스식 — 맥스 플랫</span>
    </div>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #8b95a1;">그라데이션이나 그림자 없이 완전히 납작합니다. 메인은 주황색(#bf3f0d), 보조는 옅은 회색(#F2F4F6) 면으로 기능에만 극도로 집중합니다.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px;">
    <button style="width: 100%; height: 56px; background: #bf3f0d; color: #ffffff; font-size: 17px; font-weight: 600; border: none; border-radius: 16px; cursor: pointer;">확인</button>
    <button style="width: 100%; height: 56px; background: #f2f4f6; color: #4e5968; font-size: 17px; font-weight: 600; border: none; border-radius: 16px; cursor: pointer;">취소</button>
  </div>
</div>
</x-dc>
</body>
</html>
