<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>입력칸 글자 크기 비교 (13pt ~ 19pt)</title>
  <style>
    body { 
      margin: 0; 
      background: #f7f8fa; 
      display: flex; 
      justify-content: center; 
      padding: 40px; 
      font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; 
    }
    .container { 
      width: 390px; 
      background: #ffffff; 
      padding: 30px 20px; 
      border-radius: 24px; 
      box-shadow: 0 10px 40px rgba(25, 31, 40, 0.08); 
    }
    .header { margin-bottom: 30px; }
    .title { font-size: 22px; font-weight: 700; color: #191f28; margin: 0 0 8px; letter-spacing: -0.02em; }
    .desc { font-size: 14px; color: #8b95a1; margin: 0; line-height: 1.5; }
    .field-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .field-label { font-size: 14px; font-weight: 600; color: #4e5968; }
    .field-input { 
      width: 100%; 
      height: 56px; 
      background: #f2f4f6; 
      color: #191f28; 
      border: none; 
      border-radius: 16px; 
      padding: 0 16px; 
      box-sizing: border-box; 
      outline: none; 
      font-weight: 600; 
      transition: background 0.2s;
    }
    .field-input:focus { background: #e8eaed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 class="title">글자 크기 한눈에 비교하기</h1>
      <p class="desc">가이드라인에서 권장한 13pt부터 19pt까지 1pt 단위로 입력칸 텍스트가 어떻게 보이는지 직접 비교해 보세요.</p>
    </div>
    
    <div class="field-group">
      <label class="field-label">13pt (약 17.3px)</label>
      <input type="text" class="field-input" style="font-size: 13pt;" value="오늘도 사랑해 (13pt)">
    </div>
    <div class="field-group">
      <label class="field-label">14pt (약 18.6px)</label>
      <input type="text" class="field-input" style="font-size: 14pt;" value="오늘도 사랑해 (14pt)">
    </div>
    <div class="field-group">
      <label class="field-label">15pt (약 20.0px)</label>
      <input type="text" class="field-input" style="font-size: 15pt;" value="오늘도 사랑해 (15pt)">
    </div>
    <div class="field-group">
      <label class="field-label">16pt (약 21.3px)</label>
      <input type="text" class="field-input" style="font-size: 16pt;" value="오늘도 사랑해 (16pt)">
    </div>
    <div class="field-group">
      <label class="field-label">17pt (약 22.6px)</label>
      <input type="text" class="field-input" style="font-size: 17pt;" value="오늘도 사랑해 (17pt)">
    </div>
    <div class="field-group">
      <label class="field-label">18pt (약 24.0px)</label>
      <input type="text" class="field-input" style="font-size: 18pt;" value="오늘도 사랑해 (18pt)">
    </div>
    <div class="field-group">
      <label class="field-label">19pt (약 25.3px)</label>
      <input type="text" class="field-input" style="font-size: 19pt;" value="오늘도 사랑해 (19pt)">
    </div>

  </div>
</body>
</html>
