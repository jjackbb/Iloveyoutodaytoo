<!doctype html>
<html>
<head>

<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: #3a3a3c; } a:hover { color: #2a2a2c; }
    .sheet { font-family: 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; word-break: keep-all; }
  </style>
</helmet>
<div class="sheet" style="width: 390px; padding: 20px 20px 28px; background: #ffffff; color: #191f28; box-sizing: border-box;">
  <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px;">
    <div style="display: flex; align-items: baseline; gap: 8px;">
      <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #191f28;">안쪽 면 ③</span>
      <span style="font-size: 13px; font-weight: 600; color: #8b95a1;">찐 토스식 — 여백과 구분선</span>
    </div>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.55; color: #8b95a1;">면도 선박스도 그리지 않습니다. 넉넉한 상하 여백과 아주 연한 가로 구분선 하나, 그리고 글자색(#8B95A1)만으로 구역을 세련되게 나눕니다.</p>
  </div>
  <div style="background: #ffffff; border: 1px solid #e5e8eb; border-radius: 16px; padding: 20px;">
    <p style="margin: 0 0 16px 0; font-size: 16px; line-weight: 600; color: #191f28;">작성한 내용</p>
    <div style="height: 1px; background: #f2f4f6; margin-bottom: 16px;"></div>
    <p style="margin: 0; font-size: 15px; line-height: 1.7; color: #8b95a1;">오늘 목소리 남겨줘서 고마워요. 나중에 꼭 다시 듣고 싶을 것 같아요.</p>
  </div>
</div>
</x-dc>
</body>
</html>
